<style>
:root {
  --bg: #f6f4ff;
  --card: #ffffff;
  --text: #242039;
  --muted: #77738b;
  --accent: #7655e8;
  --border: #e7e1fa;
  --correct: #16865b;
  --wrong: #d63e55;
}
body.dark {
  --bg: #151321;
  --card: #211e31;
  --text: #f5f2ff;
  --muted: #b5aecb;
  --accent: #a18aff;
  --border: #39334e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  transition: background .2s, color .2s;
}
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 16px 6%;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.brand { font-size: 22px; font-weight: 800; color: var(--accent); }
.navlinks { display: flex; gap: 18px; flex-wrap: wrap; }
a { color: var(--text); text-decoration: none; }
a:hover { color: var(--accent); }
select, button {
  font: inherit;
  border-radius: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
}
main { max-width: 850px; margin: 35px auto; padding: 0 18px 50px; }
h1 { margin-bottom: 8px; }
.subtitle { color: var(--muted); margin-top: 0; }
.settings, .quiz-card, .result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-top: 20px;
}
.settings { display: grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.primary {
  background: var(--accent);
  color: white;
  border: none;
  font-weight: 700;
}
.primary:hover { opacity: .9; }
#question { font-size: 21px; line-height: 1.5; margin: 18px 0; }
.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg);
  color: var(--text);
}
.option:hover:not(:disabled) { border-color: var(--accent); }
.option.correct { border-color: var(--correct); background: #16865b18; }
.option.wrong { border-color: var(--wrong); background: #d63e5518; }
.option:disabled { cursor: default; opacity: 1; }
.topline { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); flex-wrap: wrap; }
#feedback { margin: 16px 0; font-weight: 700; }
.correct-text { color: var(--correct); }
.wrong-text { color: var(--wrong); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.hidden { display: none !important; }
#resultScore { font-size: 38px; font-weight: 800; color: var(--accent); }
.small { color: var(--muted); font-size: 14px; }
footer { text-align: center; padding: 25px; color: var(--muted); }
</style>
</head>

        <option value="10" selected>10</option>
        <option value="15">15</option>

    </label>
    <div class="field" style="justify-content:end">
      <button class="primary" id="startBtn" type="button" data-i="start">Generate Quiz 🚀</button>

  </section>

  <section class="quiz-card hidden" id="quizCard">
    <div class="topline">
      <span id="questionCount"></span>
      <span id="scoreLabel"></span>
    </div>
    <div id="question"></div>
    <div id="options"></div>
    <div id="feedback" aria-live="polite"></div>
    <div class="actions">
      <button class="primary hidden" id="nextBtn" type="button" data-i="next">Next question →</button>
      <button id="quitBtn" type="button" data-i="quit">End quiz</button>
    </div>
  </section>

  <section class="result-card hidden" id="resultCard" aria-live="polite">
    <h2 data-i="finished">Quiz complete! 🎉</h2>
    <div id="resultScore"></div>
    <p id="resultMessage"></p>
    <p class="small" id="resultDetails"></p>
    <div class="actions">
      <button class="primary" id="againBtn" type="button" data-i="again">Generate another quiz 🔄</button>
      <button id="settingsBtn" type="button" data-i="change">Change settings</button>
    </div>
  </section>
</main>

const subjects = {
  math:"Mathematics", science:"Science", english:"English", history:"History",
  geography:"Geography", biology:"Biology", chemistry:"Chemistry", physics:"Physics",
  computer:"Computer Science"
};

function t(key) {
  return translations[lang][key] || translations.en[key] || key;
}

function setLanguage(value) {
  lang = value;
  document.documentElement.lang = lang;
  try { localStorage.setItem("nachoai-language", lang); } catch (_) {}
  document.querySelectorAll("[data-i]").forEach(el => {
    el.textContent = t(el.dataset.i);
  });
  if (questions.length && !$("quizCard").classList.contains("hidden")) {
    renderQuestion();
  } else if (!$("resultCard").classList.contains("hidden")) {
    renderResult();
  }
}

function setTheme(dark) {
  document.body.classList.toggle("dark", dark);
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
  try { localStorage.setItem("nachoai-theme", dark ? "dark" : "light"); } catch (_) {}
}

function shuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function difficultyForGrade(grade) {
  if (grade <= 4) return "easy";
  if (grade <= 8) return "medium";
  return "hard";
}

function localizedQuestion(q) {
  if (lang === "en") return q;
  // The banks are authored in English; avoid pretending untranslated questions are translated.
  // A translated question bank can be added here later without affecting quiz logic.
  return q;
}

function makeQuiz() {
  const subject = $("subject").value;
  const grade = Number($("grade").value);
  const count = Number($("count").value);
  const level = difficultyForGrade(grade);
  const bank = banks[subject] && banks[subject][level];

  if (!bank || bank.length === 0) {
    alert(t("noQuestions"));
    return;
  }

  // Every bank has ten distinct questions; shuffle question order and answer order.
  questions = shuffle(bank).slice(0, Math.min(count, bank.length)).map(q => {
    const options = q[1].map((text, i) => ({text, correct: i === q[2]}));
    const mixed = shuffle(options);
    return {
      question: localizedQuestion(q[0]),
      options: mixed.map(o => o.text),
      answer: mixed.findIndex(o => o.correct)
    };
  });

  index = 0;
  score = 0;
  answered = false;
  $("settings").classList.add("hidden");
  $("resultCard").classList.add("hidden");
  $("quizCard").classList.remove("hidden");
  renderQuestion();
}

function renderQuestion() {
  if (!questions.length || index >= questions.length) return;
  const q = questions[index];
  $("questionCount").textContent = `${t("question")} ${index + 1} / ${questions.length}`;
  $("scoreLabel").textContent = `${t("score")}: ${score}`;
  $("question").textContent = q.question;
  $("options").innerHTML = "";
  $("feedback").textContent = "";
  $("feedback").className = "";
  $("nextBtn").classList.add("hidden");
  answered = false;

  q.options.forEach((option, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option";
    btn.textContent = `${String.fromCharCode(65 + i)}. ${option}`;
    btn.addEventListener("click", () => chooseAnswer(i));
    $("options").appendChild(btn);
  });
}

function chooseAnswer(choice) {
  if (answered) return;
  answered = true;
  const q = questions[index];
  const buttons = [...$("options").querySelectorAll("button")];
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add("correct");
    else if (i === choice) btn.classList.add("wrong");
  });

  if (choice === q.answer) {
    score++;
    $("feedback").textContent = t("correct");
    $("feedback").className = "correct-text";
  } else {
    $("feedback").textContent = `${t("wrong")} ${q.options[q.answer]}`;
    $("feedback").className = "wrong-text";
  }
  $("scoreLabel").textContent = `${t("score")}: ${score}`;
  $("nextBtn").textContent = index === questions.length - 1 ? t("finished") : t("next");
  $("nextBtn").classList.remove("hidden");
}

function nextQuestion() {
  if (!answered) return;
  index++;
  if (index >= questions.length) {
    $("quizCard").classList.add("hidden");
    $("resultCard").classList.remove("hidden");
    renderResult();
  } else {
    renderQuestion();
  }
}

function renderResult() {
  const percent = questions.length ? Math.round(score / questions.length * 100) : 0;
  $("resultScore").textContent = `${score} / ${questions.length} (${percent}%)`;
  $("resultMessage").textContent = percent === 100 ? t("perfect") :
    percent >= 60 ? t("good") : t("tryAgain");
  $("resultDetails").textContent =
    `${subjects[$("subject").value]} · Grade ${$("grade").value} · ${questions.length} ${t("count").toLowerCase()}`;
}

function endQuiz() {
  $("quizCard").classList.add("hidden");
  $("resultCard").classList.remove("hidden");
  renderResult();
}

function backToSettings() {
  $("resultCard").classList.add("hidden");
  $("quizCard").classList.add("hidden");
  $("settings").classList.remove("hidden");
}

$("startBtn").addEventListener("click", makeQuiz);
$("nextBtn").addEventListener("click", nextQuestion);
$("quitBtn").addEventListener("click", endQuiz);
$("againBtn").addEventListener("click", makeQuiz);
$("settingsBtn").addEventListener("click", backToSettings);
$("language").addEventListener("change", e => setLanguage(e.target.value));
$("themeBtn").addEventListener("click", () =>
  setTheme(!document.body.classList.contains("dark"))
);

try {
  const savedLang = localStorage.getItem("nachoai-language");
  if (savedLang && translations[savedLang]) $("language").value = savedLang;
} catch (_) {}
try {
  setTheme(localStorage.getItem("nachoai-theme") === "dark");
} catch (_) {}
setLanguage($("language").value);
})();
