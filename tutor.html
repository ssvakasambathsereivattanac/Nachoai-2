<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NachoAI Tutor</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f3ff;
    color: #211b2e;
    min-height: 100vh;
}

body.dark {
    background: #14111c;
    color: #f5f2ff;
}

.navbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #ddd6ee;
    display: flex;
    align-items: center;
    padding: 0 25px;
    gap: 25px;
}

body.dark .navbar {
    background: #1d1927;
    border-color: #342d42;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #6d35d9;
    white-space: nowrap;
}

.nav-links {
    display: flex;
    gap: 18px;
    flex: 1;
}

.nav-links a {
    text-decoration: none;
    color: #625a70;
    font-weight: 600;
}

body.dark .nav-links a {
    color: #c8c0d4;
}

.nav-links a:hover {
    color: #6d35d9;
}

.nav-controls {
    display: flex;
    gap: 8px;
    align-items: center;
}

select,
button,
textarea {
    font-family: inherit;
}

select {
    padding: 9px 12px;
    border: 1px solid #d8d0e5;
    border-radius: 10px;
    background: white;
    color: #222;
}

body.dark select {
    background: #292332;
    color: white;
    border-color: #494054;
}

.theme-btn {
    border: 0;
    background: #eee9ff;
    padding: 10px 13px;
    border-radius: 10px;
    cursor: pointer;
}

body.dark .theme-btn {
    background: #30283b;
    color: white;
}

.layout {
    display: flex;
    height: calc(100vh - 70px);
}

.sidebar {
    width: 260px;
    background: white;
    border-right: 1px solid #ddd6ee;
    padding: 18px;
    overflow-y: auto;
}

body.dark .sidebar {
    background: #1b1724;
    border-color: #342d42;
}

.new-chat {
    width: 100%;
    border: 0;
    background: #6d35d9;
    color: white;
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 18px;
}

.new-chat:hover {
    background: #5a25c5;
}

.chat-title {
    font-size: 12px;
    font-weight: bold;
    color: #8b8198;
    margin: 10px 4px;
    text-transform: uppercase;
}

.chat-list button {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 11px;
    border-radius: 9px;
    cursor: pointer;
    color: #443b50;
    margin-bottom: 3px;
}

.chat-list button:hover {
    background: #f0ebfa;
}

body.dark .chat-list button {
    color: #ddd5e6;
}

body.dark .chat-list button:hover {
    background: #292332;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    background: white;
    border-bottom: 1px solid #ddd6ee;
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

body.dark .topbar {
    background: #1d1927;
    border-color: #342d42;
}

.topbar label {
    font-size: 13px;
    font-weight: bold;
    color: #71677d;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
}

.welcome {
    max-width: 750px;
    margin: 80px auto 20px;
    text-align: center;
}

.welcome .nacho {
    font-size: 55px;
    margin-bottom: 12px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.welcome p {
    color: #756c81;
    line-height: 1.6;
}

body.dark .welcome p {
    color: #b5adbf;
}

.message {
    max-width: 820px;
    margin: 0 auto 22px;
    display: flex;
    gap: 12px;
}

.message.user {
    justify-content: flex-end;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #eee8ff;
}

body.dark .avatar {
    background: #30283b;
}

.message-content {
    max-width: 75%;
    padding: 13px 16px;
    border-radius: 16px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message.assistant .message-content {
    background: white;
    border: 1px solid #e0d9e9;
}

.message.user .message-content {
    background: #6d35d9;
    color: white;
}

body.dark .message.assistant .message-content {
    background: #211d2b;
    border-color: #393142;
}

.attachment {
    margin-top: 8px;
    padding: 8px 10px;
    background: #f2edf9;
    border-radius: 8px;
    font-size: 13px;
}

body.dark .attachment {
    background: #30283b;
}

.composer-area {
    background: white;
    border-top: 1px solid #ddd6ee;
    padding: 15px 20px 20px;
}

body.dark .composer-area {
    background: #1d1927;
    border-color: #342d42;
}

.suggestions {
    max-width: 820px;
    margin: 0 auto 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.suggestion {
    border: 1px solid #ddd3ef;
    background: #faf8ff;
    color: #5d4e70;
    padding: 8px 11px;
    border-radius: 20px;
    cursor: pointer;
}

body.dark .suggestion {
    background: #292332;
    color: #ddd4e7;
    border-color: #40374a;
}

.composer {
    max-width: 820px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 9px;
    border: 1px solid #d8d0e5;
    border-radius: 16px;
    padding: 8px;
    background: white;
}

body.dark .composer {
    background: #211d2b;
    border-color: #453c51;
}

.attach-btn,
.send-btn {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 11px;
    cursor: pointer;
    flex-shrink: 0;
}

.attach-btn {
    background: #eee9ff;
}

body.dark .attach-btn {
    background: #30283b;
    color: white;
}

.send-btn {
    background: #6d35d9;
    color: white;
    font-size: 18px;
}

.send-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

textarea {
    flex: 1;
    min-height: 44px;
    max-height: 150px;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    padding: 11px 5px;
    font-size: 15px;
    color: inherit;
}

.file-preview {
    max-width: 820px;
    margin: 0 auto 9px;
    display: none;
    gap: 8px;
    flex-wrap: wrap;
}

.file-item {
    background: #eee9ff;
    padding: 8px 10px;
    border-radius: 9px;
    font-size: 13px;
}

body.dark .file-item {
    background: #30283b;
}

.remove-file {
    border: 0;
    background: transparent;
    cursor: pointer;
    margin-left: 6px;
}

.typing {
    display: inline-flex;
    gap: 4px;
}

.typing span {
    width: 6px;
    height: 6px;
    background: #8060bd;
    border-radius: 50%;
    animation: blink 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes blink {
    0%, 100% { opacity: .25; }
    50% { opacity: 1; }
}

.hidden {
    display: none !important;
}

@media (max-width: 800px) {
    .sidebar {
        display: none;
    }

    .nav-links {
        display: none;
    }

    .navbar {
        padding: 0 12px;
    }

    .message-content {
        max-width: 88%;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">🧀 NachoAI</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="tutor.html">AI Tutor</a>
        <a href="quiz.html">Practice Quiz</a>
        <a href="progress.html">Progress</a>
    </div>

    <div class="nav-controls">

        <select id="language">
            <option value="en">🇬🇧 English</option>
            <option value="km">🇰🇭 Khmer</option>
            <option value="fr">🇫🇷 Français</option>
        </select>

        <button class="theme-btn" id="themeBtn">🌙</button>

    </div>

</nav>


<div class="layout">

    <aside class="sidebar">

        <button class="new-chat" id="newChat">
            ＋ New Chat
        </button>

        <div class="chat-title">
            Conversation History
        </div>

        <div class="chat-list" id="chatList"></div>

    </aside>


    <main class="main">

        <div class="topbar">

            <label>Grade</label>

            <select id="grade">
                <option value="1">Grade 1</option>
                <option value="2">Grade 2</option>
                <option value="3">Grade 3</option>
                <option value="4">Grade 4</option>
                <option value="5">Grade 5</option>
                <option value="6">Grade 6</option>
                <option value="7">Grade 7</option>
                <option value="8" selected>Grade 8</option>
                <option value="9">Grade 9</option>
                <option value="10">Grade 10</option>
                <option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
            </select>

            <label>Subject</label>

            <select id="subject">
                <option>General</option>
                <option>Mathematics</option>
                <option>Science</option>
                <option>English</option>
                <option>History</option>
                <option>Geography</option>
                <option>Biology</option>
                <option>Chemistry</option>
                <option>Physics</option>
                <option>Computer Science</option>
                <option>Economics</option>
                <option>Business</option>
                <option>Art</option>
                <option>Music</option>
            </select>

        </div>


        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <div class="nacho">🧀</div>

                <h1>What do you want to learn?</h1>

                <p>
                    I'm NachoAI. Ask me anything about your subject,
                    send your notes, or attach a worksheet and I'll help
                    you understand it.
                </p>

            </div>

        </section>


        <div class="composer-area">

            <div class="suggestions">

                <button class="suggestion">
                    Explain this topic simply
                </button>

                <button class="suggestion">
                    Give me an example
                </button>

                <button class="suggestion">
                    Help me understand this
                </button>

            </div>


            <div class="file-preview" id="filePreview"></div>


            <form class="composer" id="composer">

                <input
                    type="file"
                    id="fileInput"
                    hidden
                    multiple
                    accept=".pdf,.txt,.md,.csv,.json,.xml,.html,.htm,image/png,image/jpeg,image/webp"
                >

                <button
                    type="button"
                    class="attach-btn"
                    id="attachBtn"
                    title="Attach a file"
                >
                    📎
                </button>

                <textarea
                    id="messageInput"
                    placeholder="Ask NachoAI anything..."
                    rows="1"
                ></textarea>

                <button
                    type="submit"
                    class="send-btn"
                    id="sendBtn"
                >
                    ➤
                </button>

            </form>

        </div>

    </main>

</div>


<script>

const $ = id => document.getElementById(id);

let currentChatId = null;
let selectedFiles = [];
let sending = false;


// ======================================================
// THEME
// ======================================================

function loadTheme() {

    const saved =
        localStorage.getItem("nachoaiTheme");

    if (saved === "dark") {

        document.body.classList.add("dark");

        $("themeBtn").textContent = "☀️";

    } else {

        $("themeBtn").textContent = "🌙";
    }
}


$("themeBtn").addEventListener("click", () => {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "nachoaiTheme",
        dark ? "dark" : "light"
    );

    $("themeBtn").textContent =
        dark ? "☀️" : "🌙";
});


// ======================================================
// LANGUAGE
// ======================================================

const translations = {

    en: {
        placeholder: "Ask NachoAI anything...",
        welcome: "What do you want to learn?",
        description:
            "I'm NachoAI. Ask me anything about your subject, send your notes, or attach a worksheet and I'll help you understand it."
    },

    km: {
        placeholder: "សួរ NachoAI អ្វីក៏បាន...",
        welcome: "តើអ្នកចង់រៀនអ្វី?",
        description:
            "ខ្ញុំគឺ NachoAI។ សួរខ្ញុំអំពីមុខវិជ្ជារបស់អ្នក ឬភ្ជាប់ឯកសារ ហើយខ្ញុំនឹងជួយអ្នកយល់។"
    },

    fr: {
        placeholder: "Posez une question à NachoAI...",
        welcome: "Qu'aimeriez-vous apprendre ?",
        description:
            "Je suis NachoAI. Posez-moi une question ou joignez un document et je vous aiderai à le comprendre."
    }

};


function updateLanguage() {

    const language =
        $("language").value;

    localStorage.setItem(
        "aitutorLanguage",
        language
    );

    const t =
        translations[language] ||
        translations.en;

    $("messageInput").placeholder =
        t.placeholder;

    $("welcome").querySelector("h1").textContent =
        t.welcome;

    $("welcome").querySelector("p").textContent =
        t.description;
}


const savedLanguage =
    localStorage.getItem("aitutorLanguage");

if (
    savedLanguage &&
    ["en", "km", "fr"].includes(savedLanguage)
) {

    $("language").value =
        savedLanguage;
}

$("language").addEventListener(
    "change",
    updateLanguage
);

updateLanguage();


// ======================================================
// CHAT HISTORY
// ======================================================

async function loadChatList() {

    try {

        const response =
            await fetch("/api/chats");

        if (!response.ok) return;

        const chats =
            await response.json();

        $("chatList").innerHTML = "";

        chats.forEach(chat => {

            const button =
                document.createElement("button");

            button.textContent =
                chat.title || "New chat";

            button.addEventListener(
                "click",
                () => openChat(chat.id)
            );

            $("chatList").appendChild(button);

        });

    } catch (error) {

        console.log(
            "Chat history unavailable:",
            error.message
        );
    }
}


// ======================================================
// NEW CHAT
// ======================================================

$("newChat").addEventListener(
    "click",
    async () => {

        try {

            const response =
                await fetch(
                    "/api/chats",
                    {
                        method: "POST"
                    }
                );

            const chat =
                await response.json();

            currentChatId =
                chat.id;

            $("messages").innerHTML = "";

            createWelcome();

            await loadChatList();

        } catch (error) {

            console.error(error);
        }
    }
);


function createWelcome() {

    const language =
        $("language").value;

    const t =
        translations[language] ||
        translations.en;

    $("messages").innerHTML = `

        <div class="welcome" id="welcome">

            <div class="nacho">🧀</div>

            <h1>${t.welcome}</h1>

            <p>${t.description}</p>

        </div>
    `;
}


// ======================================================
// OPEN CHAT
// ======================================================

async function openChat(id) {

    try {

        const response =
            await fetch(
                `/api/chats/${id}`
            );

        if (!response.ok) return;

        const chat =
            await response.json();

        currentChatId =
            chat.id;

        $("messages").innerHTML = "";

        if (
            !chat.messages ||
            chat.messages.length === 0
        ) {

            createWelcome();

            return;
        }

        chat.messages.forEach(
            message => {

                if (
                    message.role === "user" ||
                    message.role === "assistant"
                ) {

                    addMessage(
                        message.role,
                        message.content,
                        message.attachments || []
                    );
                }
            }
        );

        scrollBottom();

    } catch (error) {

        console.error(error);
    }
}


// ======================================================
// DISPLAY MESSAGE
// ======================================================

function addMessage(
    role,
    text,
    attachments = []
) {

    const welcome =
        $("welcome");

    if (welcome) {
        welcome.remove();
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${role}`;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "👤"
            : "🧀";


    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent =
        text || "";


    if (attachments.length) {

        attachments.forEach(
            name => {

                const file =
                    document.createElement("div");

                file.className =
                    "attachment";

                file.textContent =
                    "📎 " + name;

                content.appendChild(file);
            }
        );
    }


    wrapper.appendChild(avatar);
    wrapper.appendChild(content);

    $("messages").appendChild(wrapper);

    return content;
}


// ======================================================
// ATTACHMENTS
// ======================================================

$("attachBtn").addEventListener(
    "click",
    () => $("fileInput").click()
);


$("fileInput").addEventListener(
    "change",
    () => {

        selectedFiles =
            Array.from(
                $("fileInput").files
            ).slice(0, 3);

        renderFiles();
    }
);


function renderFiles() {

    const preview =
        $("filePreview");

    preview.innerHTML = "";

    if (!selectedFiles.length) {

        preview.style.display =
            "none";

        return;
    }

    preview.style.display =
        "flex";


    selectedFiles.forEach(
        (file, index) => {

            const item =
                document.createElement("div");

            item.className =
                "file-item";

            item.textContent =
                "📎 " + file.name;


            const remove =
                document.createElement("button");

            remove.className =
                "remove-file";

            remove.textContent =
                "✕";

            remove.addEventListener(
                "click",
                () => {

                    selectedFiles.splice(
                        index,
                        1
                    );

                    renderFiles();
                }
            );


            item.appendChild(remove);

            preview.appendChild(item);
        }
    );
}


function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(reader.result);

            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "Could not read file."
                        )
                    );

            reader.readAsDataURL(file);
        }
    );
}


// ======================================================
// SUGGESTIONS
// ======================================================

document
    .querySelectorAll(".suggestion")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                $("messageInput").value =
                    button.textContent.trim();

                $("messageInput").focus();
            }
        );

    });


// ======================================================
// TEXTAREA
// ======================================================

$("messageInput").addEventListener(
    "input",
    () => {

        const input =
            $("messageInput");

        input.style.height =
            "44px";

        input.style.height =
            Math.min(
                input.scrollHeight,
                150
            ) + "px";
    }
);


// ======================================================
// SEND MESSAGE
// ======================================================

$("composer").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if (sending) return;

        const text =
            $("messageInput")
                .value
                .trim();

        if (
            !text &&
            selectedFiles.length === 0
        ) {
            return;
        }

        sending = true;

        $("sendBtn").disabled =
            true;


        try {

            const attachments = [];

            for (
                const file of selectedFiles
            ) {

                const data =
                    await fileToDataURL(file);

                attachments.push({

                    name:
                        file.name,

                    data:
                        data
                });
            }


            addMessage(
                "user",
                text ||
                "Please explain my attached file.",
                selectedFiles.map(
                    file => file.name
                )
            );


            $("messageInput").value = "";

            $("messageInput").style.height =
                "44px";


            const typing =
                addMessage(
                    "assistant",
                    ""
                );


            typing.innerHTML = `

                <span class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </span>
            `;


            scrollBottom();


            const response =
                await fetch(
                    "/api/tutor",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                chatId:
                                    currentChatId,

                                message:
                                    text,

                                language:
                                    $("language").value,

                                grade:
                                    $("grade").value,

                                subject:
                                    $("subject").value,

                                attachments:
                                    attachments
                            })
                    }
                );


            if (!response.ok) {

                let errorText =
                    "NachoAI could not respond.";

                try {

                    const errorData =
                        await response.json();

                    errorText =
                        errorData.error ||
                        errorText;

                } catch {}

                typing.textContent =
                    errorText;

                return;
            }


            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            let buffer = "";

            let answerStarted =
                false;


            while (true) {

                const {
                    value,
                    done
                } =
                    await reader.read();

                if (done) break;

                buffer +=
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );


                const events =
                    buffer.split("\n\n");

                buffer =
                    events.pop() || "";


                for (
                    const event of events
                ) {

                    const line =
                        event
                            .split("\n")
                            .find(
                                line =>
                                    line.startsWith(
                                        "data:"
                                    )
                            );

                    if (!line) continue;


                    try {

                        const data =
                            JSON.parse(
                                line.slice(5).trim()
                            );


                        if (
                            data.type ===
                            "delta"
                        ) {

                            if (
                                !answerStarted
                            ) {

                                typing.innerHTML =
                                    "";

                                answerStarted =
                                    true;
                            }

                            typing.textContent +=
                                data.text;

                            scrollBottom();
                        }


                        if (
                            data.type ===
                            "done"
                        ) {

                            currentChatId =
                                data.chatId;

                            loadChatList();
                        }


                        if (
                            data.type ===
                            "error"
                        ) {

                            typing.textContent =
                                data.error;
                        }

                    } catch (
                        parseError
                    ) {

                        console.log(
                            parseError
                        );
                    }
                }
            }

        } catch (error) {

            console.error(error);

            const errorMessage =
                addMessage(
                    "assistant",
                    "❌ Could not connect to NachoAI. Make sure the server is running."
                );

        } finally {

            selectedFiles = [];

            $("fileInput").value = "";

            renderFiles();

            sending = false;

            $("sendBtn").disabled =
                false;

            $("messageInput").focus();
        }

    }
);


// ======================================================
// SCROLL
// ======================================================

function scrollBottom() {

    $("messages").scrollTop =
        $("messages").scrollHeight;
}


// ======================================================
// ENTER TO SEND
// ======================================================

$("messageInput").addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            $("composer").requestSubmit();
        }
    }
);


// ======================================================
// START
// ======================================================

loadTheme();

loadChatList();

</script>

</body>
</html>
